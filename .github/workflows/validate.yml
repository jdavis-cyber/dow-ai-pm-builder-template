name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  whole-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Whole-template validation
        run: python3 automation/validate_template.py
      - name: Golden-path smoke test
        run: |
          git config --global user.name "ci-runner"
          git config --global user.email "ci-runner@users.noreply.github.com"
          python3 automation/smoke_test_template.py
      - name: Governance test suite
        run: |
          python3 -m pip install pytest
          python3 -m pytest tests/ -q
