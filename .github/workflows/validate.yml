name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whole-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Whole-template validation
        run: python3 automation/validate_template.py
      - name: Golden-path smoke test
        run: |
          git config --global user.name "ci-runner"
          git config --global user.email "ci-runner@users.noreply.github.com"
          python3 automation/smoke_test_template.py
      - name: Governance test suite
        run: |
          python3 -m pip install --require-hashes -r requirements-ci.txt
          python3 -m pytest tests/ -q
